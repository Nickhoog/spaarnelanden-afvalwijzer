[project]
name = "spaarnelanden-hacs"
version = "0.1.0"
description = "Home Assistant custom integration voor de Spaarnelanden afvalkalender"
requires-python = ">=3.14.2"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# Alleen voor de lokale Windows-testomgeving: lru-dict 1.3.0 heeft geen Windows-wheel voor Python 3.14.
override-dependencies = ["lru-dict>=1.3.1"]
